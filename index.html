    function annualTable(result,selected){let rows=selectedAnnualRows(result,selected),indices=selected==='all'?state.children.map((_,i)=>i):[selected],body=rows.map((view,index)=>{let row=result.annual[index],scope=selected==='all'?'all':selected,id=`annual-detail-${scope}-${row.year}`,grades=indices.map(i=>`${esc(state.children[i].name)}・${schoolStatus(state,state.children[i],row.year)}`).join('<br>'),title=selected==='all'?`${row.year}年の子ども別・資金内訳`:`${row.year}年・${esc(state.children[selected].name)}の資金内訳`;return `<tr class="annual-summary-row" data-year="${row.year}" data-action="toggle-annual-detail" data-detail-id="${id}" aria-expanded="false" aria-controls="${id}" tabindex="0" role="button"><td><span class="annual-toggle"><span>${row.year}年</span><small>内訳を表示</small></span></td><td class="age-cell">${grades}</td><td class="money-cell">${money(view.householdDirect)}</td><td class="money-cell">${money(view.contribution)}</td><td class="money-cell">${view.benefitCash?money(view.benefitCash):'—'}</td><td class="money-cell">${view.withdrawal?money(view.withdrawal):'—'}</td><td class="money-cell ${view.shortage?'warn-cell':''}">${view.shortage?money(view.shortage):'—'}</td><td class="money-cell good-cell">${money(view.balance)}</td></tr><tr id="${id}" class="annual-detail-row" data-annual-detail hidden><td colspan="8"><div class="annual-detail"><p class="annual-detail-title">${title}</p><div class="annual-child-grid">${indices.map(i=>childDetail(result,row,i)).join('')}</div></div></td></tr>`}).join('');return `<div class="table-wrap annual-table-window ${annualExpanded?'expanded':''}"><table class="annual-table compact"><thead><tr><th>年</th><th>お子さまの学年</th><th>家計から直接払う</th><th>家計から積立</th><th>給付の入金</th><th>資産から支払う</th><th>未充当</th><th>年末資産</th></tr></thead><tbody>${body}</tbody></table></div>`}
    function childGoal(c,index,result,needed){let univ=universityYear(c),univRecords=schoolRecords(state,c,index).filter(r=>r.stage==='u'),target=univRecords.reduce((n,r)=>n+r.tuition+r.entry+r.cram+r.lesson+r.other-discountFor(state,r).total,0),fund=result.funds[index],before=fund.universityBefore??fund.cash+fund.invest,gap=Math.max(0,target-before),now=new Date(),months=Math.max(0,(univ-now.getFullYear())*12+(4-(now.getMonth()+1))),wait=`あと${Math.floor(months/12)}年${months%12}か月`;return `<div class="fund-summary"><span>${esc(c.name)}・大学入学時に用意できる見込み</span><b>${money(before)}</b><div class="row"><span>大学期間に必要な教育費</span><b>${money(target)}（${gap?`不足 ${money(gap)}`:'不足なし'}）</b></div><div class="row"><span>大学入学年度</span><b>${univ}年（${wait}）</b></div></div>`}
    function dashboard(){let result=calculate(state),selected=state.resultChild==='all'?'all':Math.max(0,Math.min(+state.resultChild||0,state.children.length-1)),scopeName=selected==='all'?'合計':state.children[selected].name,filterButtons=`<button class="${selected==='all'?'active':''}" data-action="result-child" data-index="all">合計</button>${state.children.map((c,i)=>`<button class="${selected===i?'active':''}" data-action="result-child" data-index="${i}">${esc(c.name)}</button>`).join('')}`,needed=state.children.map((_,i)=>requiredMonthly(state,i)),neededTotal=needed.some(v=>v===null)?null:needed.reduce((a,b)=>a+b,0),current=state.children.reduce((n,c)=>n+(+c.investment.base||0),0),first=result.firstShortage,shortageText=first?`${first.year}年${first.month}月・${state.children[first.child].name}`:'不足なし',status=saveMessage||(!storageAvailable?'この環境では自動保存できません。':'');return pageHead('総合結果','最初に必要な月額と、大学入学前の準備見込みを確認できます。',`<span><button class="button secondary" data-action="export">設定を書き出す</button> <button class="button secondary" data-action="import">設定を読み込む</button><input class="file-input" type="file" accept="application/json" data-import> <button class="button ghost" data-action="reset">初期設定に戻す</button></span>`)+`${status?`<p class="status-message">${esc(status)}</p>`:''}<section class="decision-grid"><div class="decision primary"><span>必要な家計積立（月額）</span><b>${neededTotal===null?'要見直し':money(neededTotal)}</b><small>子ども別に、すべての教育費を資産で払う前提の目安</small></div><div class="decision"><span>現在の家計積立（月額）</span><b>${money(current)}</b><small>期間指定の増減分は年別表に反映</small></div><div class="decision"><span>大学入学前の準備見込み</span><b>${money(result.funds.reduce((n,f)=>n+(f.universityBefore||0),0))}</b><small>入学準備費の支払い前</small></div><div class="decision ${first?'warn':'primary'}"><span>最初に不足する時期</span><b>${shortageText}</b><small>${first?`${money(first.amount)} が未充当`:'設定された支払いに対する不足はありません'}</small></div></section><section class="card panel"><h3>子ども別の準備目標</h3><p class="sub">大学までの教育費と、大学入学前に積み上がる資産を分けて表示します。小中高の家計直接負担はここに混ぜません。</p><div class="fund-summary-grid">${state.children.map((c,i)=>childGoal(c,i,result,needed[i])).join('')}</div></section><div class="kpis ${result.totals.benefitCash||result.totals.directDiscount?'':'no-benefits'}" style="margin-top:18px">${kpi('教育費総額',money(result.totals.gross),'支払う年の概算')}${kpi('授業料などの減額',result.totals.directDiscount?`−${money(result.totals.directDiscount)}`:'—','給付とは別の支出減額','good')}${kpi('給付の入金',result.totals.benefitCash?money(result.totals.benefitCash):'—','児童手当・その他給付','good')}${kpi('家計から直接払う',money(result.totals.householdDirect),'資産を使わない教育費')}${kpi('未充当',result.totals.shortage?money(result.totals.shortage):'なし','支払時点で不足した額',result.totals.shortage?'warn':'good')}</div><section class="card panel chart-panel"><div class="chart-card-head"><h3>年ごとの推移</h3><details class="chart-help"><summary aria-label="グラフの説明">?</summary><div class="help-panel"><p>${esc(scopeName)}の教育費を棒、教育資産を折れ線で表示します。合計では総資産と子どもごとの資産を比較できます。</p><p>家族で共有する教育用預金は合計の資産線だけに含み、子ども別の資産線には按分していません。</p></div></details></div><div class="trend-filter"><span class="trend-filter-label">表示する資金</span><div class="child-switch">${filterButtons}</div></div>${annualChart(result,selected)}<div class="legend asset-legend"><span><i style="background:#177761"></i>${selected==='all'?'教育費合計':`${esc(scopeName)}の教育費`}</span>${assetLegend(result,selected)}</div></section><section class="card panel annual-panel"><div class="annual-card-head"><div class="annual-title-line"><h3>年ごとの内訳</h3><p>クリックすると詳細を開きます。金額はすべて万円です。</p></div><button class="button secondary" data-action="toggle-annual-rows">${annualExpanded?'5年表示に戻す':'全行表示'}</button></div>${annualTable(result,selected)}</section><section class="card panel outlook-panel"><h3>資金計算の前提</h3><div class="note result-note">教育費は、資産からの支払い・家計から直接払う費用・未充当に一度だけ割り当てます。生活防衛資金や老後資金を教育資金として使う前提にはしていません。</div><details class="info-details"><summary>この試算について</summary><p>入力値はこのブラウザ内に保存します。外部への送信や解析は実装していません。端末変更やブラウザデータ削除に備え、設定ファイルを書き出せます。</p><ul><li>教育費は現在価格を基に、設定した教育費上昇率を支払う年まで反映します。年別の手動入力は、その年に支払う固定額です。</li><li>入学準備費は入学前の3月、授業料は4月、学校関連費は4月から翌年3月に月割りで支払う概算です。</li><li>児童手当は生年月と年長順を使う月次概算です。多子世帯の大学減免は初期値では見込みません。</li><li>こどもNISA前提は2027年以降の税制改正大綱の説明を使った概算で、実際の口座・払出し条件は金融機関と公式案内を確認してください。</li><li>未就学費、留学、浪人、受験・引越しの個別費用、高額学部の差額は基本額に含めません。</li></ul><p><a href="https://www.fsa.go.jp/access/r7/270.html" target="_blank" rel="noreferrer">金融庁：未成年者のつみたて投資枠の説明</a> ／ <a href="https://www.cfa.go.jp/policies/kokoseido/jidouteate/mottoouen" target="_blank" rel="noreferrer">こども家庭庁：児童手当</a> ／ <a href="https://www.mext.go.jp/kyufu/qa/index.html" target="_blank" rel="noreferrer">文部科学省：高等教育の修学支援</a></p></details></section>`}
    function childManager(){return `<section class="card panel"><h3>こどもの設定</h3><p class="sub">名前と生年月日から、4月1日生まれを含む通常の入学年度を自動計算します。</p><div class="child-manager-list">${state.children.map((c,i)=>`<div class="child-manager-row">${childInput(i,'名前','name',c.name,'text','maxlength="30"')}${childInput(i,'生年月日','birth',c.birth,'date')}<button class="icon-button" data-action="remove-child" data-child="${i}" ${state.children.length===1?'disabled':''}>削除</button></div>`).join('')}</div><div class="child-manager-actions"><button class="button secondary" data-action="add-child">＋ こどもを追加</button></div></section>`}
    function education(){let c=state.children[state.edChild],i=state.edChild,records=schoolRecords(state,c,i),preset=state.common.preset||'standard',switcher=state.children.map((child,index)=>`<button class="${index===i?'active':''}" data-action="child" data-index="${index}">${esc(child.name)}</button>`).join(''),rows=records.map(r=>{let overridden=!!c.overrides?.[r.key];return `<tr><td>${r.year}</td><td>${stageShortLabel(r)}</td>${['tuition','entry','cram','lesson','other'].map(kind=>`<td><input type="text" inputmode="decimal" data-man data-row="${r.key}" data-cost="${kind}" value="${man(r[kind])}"></td>`).join('')}<td><b>${money(r.tuition+r.entry+r.cram+r.lesson+r.other)}</b></td><td>${overridden?`<button class="icon-button" data-action="reset-override" data-row="${r.key}">自動に戻す</button>`:'自動'}</td></tr>`}).join('');return pageHead('教育費設定','まず進路の大枠を選び、必要な年だけ詳細を補正します。')+childManager()+`<section class="card panel simple-panel"><div class="section-title first">進路の目安</div><div class="preset-list">${Object.entries(presets).map(([key,item])=>`<button class="${key===preset?'active':''}" data-action="preset" data-preset="${key}">${item.label}</button>`).join('')}</div><p class="foot">大学区分と自宅外通学は、下のお子さま別設定で選べます。初期費用には授業料、学校関連費、入学準備費、学校外活動費を分けて置いています。</p></section><section class="card panel simple-panel"><div class="child-switch">${switcher}</div><div class="form-grid three">${childSelect(i,'小学校','paths.el',c.paths.el,schoolChoices.el)}${childSelect(i,'中学校','paths.j',c.paths.j,schoolChoices.j)}${childSelect(i,'高校','paths.h',c.paths.h,schoolChoices.h)}${childSelect(i,'大学','paths.u',c.paths.u,schoolChoices.u)}${childSelect(i,'大学の通学','paths.home',c.paths.home,[['home','自宅通学'],['away','自宅外通学']])}${childSelect(i,'大学の修業年数','paths.years',c.paths.years,[[4,'4年'],[6,'6年']])}</div><p class="foot">小学校から大学までの入学年度は、生年月日から通常進学として自動計算します。</p></section><section class="card panel simple-panel"><h3>年別の教育費（詳細）</h3><p class="sub">初期値は現在価格の大まかな目安です。進学準備費・受験・引越しなどは「その他」で必要な年だけ調整してください。6年制の高額学部は手動補正が必要です。</p><div class="table-wrap"><table class="cost-table"><thead><tr><th>年</th><th>学年</th><th>授業料等</th><th>入学準備費</th><th>塾</th><th>習い事</th><th>その他</th><th>年計</th><th>設定</th></tr></thead><tbody>${rows}</tbody></table></div><p class="foot">基準値の統計年度・集計範囲は今後の更新対象です。最新の学習費調査・学校の募集要項で実額を確認してください。</p></section>`}
    function investmentPlan(c,index){let periodsHtml=(c.investment.periods||[]).map((p,n)=>`<div class="schedule"><div class="schedule-head"><h4>期間 ${n+1}</h4><button class="icon-button" data-action="remove-period" data-child="${index}" data-period="${n}">削除</button></div><div class="form-grid three">${childInput(index,'開始（積立開始から何年目）',`investment.periods.${n}.start`,p.start,'number','min="1"')}${childInput(index,'終了（何年目まで）',`investment.periods.${n}.end`,p.end,'number','min="1"')}${childCurrency(index,'この期間の月額',`investment.periods.${n}.monthly`,p.monthly)}</div></div>`).join('');return `<section class="card panel plan-card"><h3>${esc(c.name)}の教育資産と積立</h3><div class="section-title first">現在の教育資産</div><div class="form-grid">${childCurrency(index,'預金・現金','preparedCash',c.preparedCash)}${childCurrency(index,'運用中の資産（現在の評価額）','existingInvestmentValue',c.existingInvestmentValue)}</div><div class="section-title">これからの積立</div><p class="sub">通常の月額は、家計から追加する積立額です。</p>${childCurrency(index,'通常の積立額（月額）','investment.base',c.investment.base)}<div class="period-list">${periodsHtml}</div><button class="button secondary add-period" data-action="add-period" data-child="${index}">＋ 途中で金額を変える</button></section>`}
    function investment(){let mode=state.common.nisaMode;return pageHead('積立・運用','準備済み預金、家計からの積立、運用前提だけで試算できます。')+`<section class="card panel"><div class="section-title first">共通の前提</div><div class="form-grid three">${input('積立開始','common.start',state.common.start,'month')}${currency('親の教育用預金（共有）','common.preparedCash',state.common.preparedCash)}${input('想定年利（％）','common.rate',state.common.rate,'number','min="0" max="15" step="0.1"')}${input('教育費上昇率（％）','common.inflation',state.common.inflation,'number','min="0" max="10" step="0.1"')}${select('資産から支払う教育費','common.withdraw',state.common.withdraw,[['university','大学から'],['high','高校から'],['all','すべての教育費']])}${select('積立の扱い','common.nisaMode',mode,[['free','自由な積立試算'],['nisa','こどもNISA前提（2027年以降の制度案）']])}</div>${mode==='nisa'?`<label class="check"><input type="checkbox" data-bind="common.nisaCashFallback" ${state.common.nisaCashFallback?'checked':''}>NISA枠を超えた積立は教育用の現金として積み立てる</label><p class="foot">未成年者枠は年60万円・生涯600万円・2027年以降・12歳以降の払出しを前提にした概算です。口座の実際の条件は必ず確認してください。</p>`:`<p class="foot">自由な積立試算は、口座種別や払出し条件を固定しません。</p>`}</section><div class="grid investment-grid" style="margin-top:18px">${state.children.map(investmentPlan).join('')}</div>`}
    function benefits(){let b=state.benefits;return pageHead('制度・給付','給付は資産への入金、授業料支援は教育費の減額として一度だけ扱います。')+`<section class="card panel"><div class="section-title first">かんたん設定</div><div class="form-grid three">${input('児童手当を教育費に回す割合（％）','benefits.allocation',b.allocation,'number','min="0" max="100"')}${currency('その他の給付（年額）','benefits.manualAnnual',b.manualAnnual)}${input('その他給付の開始年','benefits.manualStart',b.manualStart,'number','min="2026" max="2100"')}</div><label class="check"><input type="checkbox" data-bind="benefits.childAllowance" ${b.childAllowance?'checked':''}>児童手当を教育資産へ入金する</label><p class="foot">児童手当は生年月・年長順・年度末までの月次概算です。登録順を変えても金額は変わりません。</p></section><div class="benefit-grid"><section class="card benefit"><div class="benefit-head"><div><h3>高校授業料支援</h3><p class="benefit-summary">授業料から上限まで差し引く</p></div></div><label class="check"><input type="checkbox" data-bind="benefits.highSupport" ${b.highSupport?'checked':''}>試算に含める</label></section><section class="card benefit"><div class="benefit-head"><div><h3>大学の多子世帯支援</h3><p class="benefit-summary">条件を満たす年だけの概算</p></div></div><label class="check"><input type="checkbox" data-bind="benefits.universitySupport" ${b.universitySupport?'checked':''}>条件を満たす間だけ見込む</label><p class="foot">初期値は見込まない設定です。扶養人数・所得・資産・対象校等の確認は別途必要です。</p></section><section class="card benefit"><div class="benefit-head"><div><h3>その他給付</h3><p class="benefit-summary">親の教育用預金へ月割りで入金</p></div></div><p class="foot">自治体や勤務先の給付、返済不要の奨学金をまとめて入力できます。</p></section></div><details class="info-details"><summary>制度の詳細を補正する</summary><div class="form-grid three">${currency('高校・公立の授業料上限','benefits.highPublic',b.highPublic)}${currency('高校・私立の授業料上限','benefits.highPrivate',b.highPrivate)}${input('登録していない年上の扶養きょうだい','benefits.additionalEligibleSiblings',b.additionalEligibleSiblings,'number','min="0" max="10"')}</div><p>大学支援は、登録したお子さまが大学を卒業すると扶養カウントから外れる仮定です。受給確定ではありません。</p></details><div class="note" style="margin-top:18px">貸与型奨学金や教育ローンは返済が必要なため、給付として差し引きません。</div>`}
    function render(){let html=state.page==='education'?education():state.page==='investment'?investment():state.page==='benefits'?benefits():dashboard();app.innerHTML=html;document.querySelectorAll('[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===state.page))}
    function commit(next){let errors=validateModel(next);if(Object.keys(errors).length){uiErrors=errors;return false}state=next;uiErrors={};saveMessage='';save();return true}
    function parsedValue(el){if(el.type==='checkbox')return el.checked;if(String(el.value??'').trim()===''&&el.dataset.optional!==undefined)return '';if(el.type==='month')return validMonth(el.value)?el.value:null;if(el.type==='date')return validDate(el.value)?el.value:null;if(el.dataset.man!==undefined)return manOrNull(el.value);if(el.type==='number'){let n=numberOrNull(el.value);return n===null?null:n}return el.value}
    function applyInput(el){let value=parsedValue(el),path=el.dataset.bind||'',childPath=el.dataset.childBind;if(value===null){uiErrors[childPath?`children.${childPath}`:path]='有効な値を入力してください。';render();return}let next=clone(state);if(childPath){let [index,...rest]=childPath.split('.');setPath(next.children[+index],rest.join('.'),value)}else setPath(next,path,value);if(commit(next))render();else render()}
    function nextChildName(){let names=new Set(state.children.map(c=>c.name)),n=1;while(names.has(`お子さま ${n}`))n++;return `お子さま ${n}`}
    document.addEventListener('click',event=>{let target=event.target.closest?.('[data-page],[data-action]');if(!target)return;let action=target.dataset.action;if(target.dataset.page){state.page=target.dataset.page;save();render();return}if(action==='result-child'){state.resultChild=target.dataset.index==='all'?'all':+target.dataset.index;save();render();return}if(action==='toggle-annual-rows'){annualExpanded=!annualExpanded;render();return}if(action==='toggle-annual-detail'){let detail=document.getElementById(target.dataset.detailId),open=detail?.hidden;if(!detail)return;document.querySelectorAll('[data-annual-detail]').forEach(row=>row.hidden=true);document.querySelectorAll('[data-action="toggle-annual-detail"]').forEach(row=>{row.setAttribute('aria-expanded','false');let small=row.querySelector('small');if(small)small.textContent='内訳を表示'});detail.hidden=!open;target.setAttribute('aria-expanded',String(open));target.querySelector('small').textContent=open?'内訳を閉じる':'内訳を表示';return}if(action==='child'){state.edChild=+target.dataset.index;save();render();return}if(action==='preset'){let preset=presets[target.dataset.preset],next=clone(state);next.common.preset=target.dataset.preset;next.children.forEach(c=>Object.assign(c.paths,preset.paths));if(commit(next))render();return}if(action==='add-child'){let next=clone(state);next.children.push(createChild(new Date().toISOString().slice(0,10),nextChildName()));next.edChild=next.children.length-1;if(commit(next))render();return}if(action==='remove-child'&&state.children.length>1){let index=+target.dataset.child;if(confirm(`${state.children[index].name}の設定を削除しますか？`)){let next=clone(state);next.children.splice(index,1);next.edChild=Math.min(next.edChild,next.children.length-1);next.resultChild='all';if(commit(next))render()}return}if(action==='add-period'){let next=clone(state);next.children[+target.dataset.child].investment.periods.push({start:1,end:1,monthly:0});if(commit(next))render();return}if(action==='remove-period'){let next=clone(state);next.children[+target.dataset.child].investment.periods.splice(+target.dataset.period,1);if(commit(next))render();return}if(action==='reset-override'){let next=clone(state);delete next.children[next.edChild].overrides[target.dataset.row];if(commit(next))render();return}if(action==='reset'){if(confirm('入力した設定を初期値に戻しますか？')){state=defaults();uiErrors={};save();render()}return}if(action==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='こども教育資金シミュレーター設定.json';a.click();URL.revokeObjectURL(url);return}if(action==='import'){document.querySelector('[data-import]')?.click()}});
    document.addEventListener('keydown',event=>{let row=event.target.closest?.('[data-action="toggle-annual-detail"]');if(row&&(event.key==='Enter'||event.key===' ')){event.preventDefault();row.click()}});
    document.addEventListener('change',event=>{let el=event.target;if(el.matches('[data-import]')){let file=el.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let next=migrate(JSON.parse(reader.result)),errors=validateModel(next);if(Object.keys(errors).length)throw new Error('設定項目に不足または不正な値があります。');state=next;uiErrors={};saveMessage='設定を読み込みました。';save();render()}catch{saveMessage='設定を読み込めませんでした。現在の設定は変更していません。';render()}};reader.readAsText(file);return}if(el.dataset.bind||el.dataset.childBind){applyInput(el);return}if(el.dataset.row){let value=manOrNull(el.value);if(value===null||value<0){uiErrors[`override.${el.dataset.row}.${el.dataset.cost}`]='0以上の金額を入力してください。';render();return}let next=clone(state),child=next.children[next.edChild];child.overrides[el.dataset.row]??={};child.overrides[el.dataset.row][el.dataset.cost]=value;if(commit(next))render()}});
    function positionChartTip(item,x,y){let tip=item.closest('.chart-wrap')?.querySelector('.chart-tooltip');if(!tip)return;let text=item.dataset.chartTip.replace('｜学年','\n学年').replace('｜教育費','\n教育費').replace('｜家計から直接','\n家計から直接').replace('｜積立取崩','\n積立取崩').replace('｜年末資産','\n年末資産');tip.textContent=text;tip.classList.add('show');tip.style.left=`${Math.max(12,Math.min(x+14,window.innerWidth-tip.offsetWidth-12))}px`;tip.style.top=`${Math.max(12,y-tip.offsetHeight-14)}px`}
    function hideChartTip(item){item.closest('.chart-wrap')?.querySelector('.chart-tooltip')?.classList.remove('show')}
    document.addEventListener('pointermove',event=>{let item=event.target.closest?.('[data-chart-tip]');if(item)positionChartTip(item,event.clientX,event.clientY)});document.addEventListener('pointerout',event=>{let item=event.target.closest?.('[data-chart-tip]');if(item&&!item.contains(event.relatedTarget))hideChartTip(item)});document.addEventListener('focusin',event=>{let item=event.target.closest?.('[data-chart-tip]');if(item){let rect=item.getBoundingClientRect();positionChartTip(item,rect.left+rect.width/2,rect.top)}});document.addEventListener('focusout',event=>{let item=event.target.closest?.('[data-chart-tip]');if(item)hideChartTip(item)});
    function render(){let html=state.page==='education'?education():state.page==='investment'?investment():state.page==='benefits'?benefits():dashboard();app.innerHTML=html;if(state.page==='investment'&&state.common.nisaMode==='nisa'){let host=app.querySelector('.card.panel');if(host)host.insertAdjacentHTML('beforeend',`<p class="note">この設定でNISAに投資できない見込み額：${money(calculate(state).totals.nisaBlocked)}。現金への振替をオフにすると、この金額は教育資産に入りません。</p>`)}document.querySelectorAll('[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===state.page))}
    const baseRender=render;
    render=function(){baseRender();if(state.page==='education'&&Object.keys(state.children[state.edChild].overrides||{}).length){let panels=app.querySelectorAll('.simple-panel'),panel=panels[panels.length-1];if(panel)panel.insertAdjacentHTML('beforeend','<p class="status-message">年別の手動上書きがあります。学校種を変更しても、上書きした年は固定額のままです。</p>')}if(state.page==='investment'){Object.entries(uiErrors).filter(([key])=>key.includes('.investment.periods')).forEach(([key,message])=>{let index=+key.split('.')[1],card=app.querySelectorAll('.plan-card')[index];if(card)card.insertAdjacentHTML('beforeend',`<p class="form-error">${esc(message)}</p>`)})}};
    const baseHideChartTip=hideChartTip;
    hideChartTip=function(item){if(item.dataset.pinned==='true')return;baseHideChartTip(item)};
    const resultLabelRender=render;
    render=function(){resultLabelRender();const labels={'年ごとの家計・資産の内訳':'年ごとの内訳','家計から直接払う':'家計支出額','家計から積立':'年間積立額','給付の入金':'給付金等','資産から支払う':'積立取崩額','未充当':'不足額','年末資産':'年末積立額','直接負担':'家計支出額','取崩':'積立取崩額','給付入金':'給付金等'};app.querySelectorAll('.annual-panel h3, .annual-table th, .annual-child-metric span, .kpis .kpi > span').forEach(element=>{let replacement=labels[element.textContent.trim()];if(replacement)element.textContent=replacement});let goals=app.querySelector('.fund-summary-grid')?.closest('section');if(goals){let heading=goals.querySelector('h3'),description=goals.querySelector('.sub');if(heading)heading.textContent='大学に向けた準備（子ども別）';if(description)description.textContent='大学に入る直前までに用意できるお金と、大学期間に必要な教育費を比べます。毎月の積立目安は、小中高を含む全教育費を資産から払う場合の目安です。'}};
    function setupAnnualTableWindow(){let viewport=app.querySelector('.annual-table-window:not(.expanded)');if(!viewport)return;let header=viewport.querySelector('thead'),rows=[...viewport.querySelectorAll('.annual-summary-row')],visibleRows=rows.slice(0,5);if(header&&visibleRows.length){let height=header.getBoundingClientRect().height+visibleRows.reduce((sum,row)=>sum+row.getBoundingClientRect().height,0)+2;viewport.style.maxHeight=`${Math.ceil(height)}px`}let current=rows.find(row=>+row.dataset.year>=CURRENT_YEAR)||rows[0];if(current)viewport.scrollTop=Math.max(0,current.offsetTop-(header?.getBoundingClientRect().height||0))}
    const simplifiedDashboardRender=render;
    render=function(){simplifiedDashboardRender();if(state.page!=='dashboard')return;let grid=app.querySelector('.decision-grid');if(grid){grid.querySelectorAll('.decision').forEach(card=>{let label=card.querySelector('span')?.textContent.trim();if(['必要な家計積立（月額）','大学入学前の準備見込み'].includes(label))card.remove()});grid.style.gridTemplateColumns='repeat(auto-fit, minmax(250px, 1fr))'}setupAnnualTableWindow()};
    const orderedDashboardRender=render;
    render=function(){orderedDashboardRender();if(state.page!=='dashboard')return;let goals=app.querySelector('.fund-summary-grid')?.closest('section');if(goals){let description=goals.querySelector('.sub');if(description)description.textContent='大学に入る直前までに用意できるお金と、大学期間に必要な教育費を比べます。'}[app.querySelector('.chart-panel'),app.querySelector('.annual-panel'),app.querySelector('.decision-grid'),app.querySelector('.kpis'),goals,app.querySelector('.outlook-panel')].forEach(section=>{if(section)app.append(section)})};
    document.addEventListener('click',event=>{let item=event.target.closest?.('[data-chart-tip]');if(!item)return;let pinned=item.dataset.pinned==='true';document.querySelectorAll('[data-chart-tip]').forEach(node=>delete node.dataset.pinned);if(!pinned){item.dataset.pinned='true';positionChartTip(item,event.clientX,event.clientY)}else{delete item.dataset.pinned;baseHideChartTip(item)}});
    window.__educationSimulator={calculate,defaults,migrate,validateModel,schoolRecords,elementaryYear,universityYear,requiredMonthly};render();
  })();
