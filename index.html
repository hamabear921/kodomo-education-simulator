<body>
  <header><div class="top"><div class="brand"><div class="mark">芽</div><div><h1>こども教育資金シミュレーター</h1><p>教育費・給付・積立資産をまとめて見通す</p></div></div><small>制度の基準日：2026年9月<br>試算値は家計計画の目安です</small></div><nav class="nav" aria-label="画面切替"><button data-page="dashboard">総合結果</button><button data-page="education">教育費設定</button><button data-page="investment">積立・運用</button><button data-page="benefits">制度・給付</button></nav></header>
  <main id="app"></main>
  <script>
    const CURRENT_YEAR=2026, KEY='kodomo-education-simulator-v1';
    const money=n=>new Intl.NumberFormat('ja-JP',{minimumFractionDigits:0,maximumFractionDigits:1}).format((n||0)/10000)+'万円';
    const formattedNumber=n=>n===''?'':new Intl.NumberFormat('ja-JP',{maximumFractionDigits:0}).format(Math.round(n||0));
    const formattedMan=n=>n===''?'':new Intl.NumberFormat('ja-JP',{maximumFractionDigits:1}).format((n||0)/10000);
    const numberValue=v=>{let n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:0};
    const man=money;
    const manValue=v=>numberValue(v)*10000;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const emptyPlan=()=>({base:15000,periods:[]});
    const defaults=()=>({version:3,page:'dashboard',edChild:0,common:{start:'2027-01',targetAge:18,rate:3,inflation:2,nisaLimit:6000000,withdraw:'university'},benefits:{childAllowance:true,allocation:100,highSupport:true,highPublic:118800,highPrivate:457200,universitySupport:true,dependents:2,manualAnnual:0,manualStart:2030,manualEnd:2030},children:[child('2023-12','お子さま 1'),child('2026-09','お子さま 2')]});
    function child(birth,name){return{name,birth,paths:{el:'public',j:'public',h:'public',u:'national',home:'home',years:4},extras:{el:{cram:80000,lesson:120000,other:60000},j:{cram:240000,lesson:0,other:70000},h:{cram:180000,lesson:0,other:80000},u:{cram:0,lesson:0,other:100000}},overrides:{},investment:emptyPlan()}}
    function nextChildName(){let names=new Set(state.children.map(c=>c.name)),n=1;while(names.has(`お子さま ${n}`))n++;return `お子さま ${n}`}
    let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(state?.version===1){state.children.forEach(c=>c.investment=JSON.parse(JSON.stringify(state.investment||emptyPlan())));delete state.investment;state.version=2}if(state?.version===2){state.children.forEach(c=>c.investment.periods=(c.investment.periods||[]).filter(p=>Object.values(p).some(v=>String(v??'').trim()!=='')));state.version=3}if(!state||state.version!==3)state=defaults();state.version=3;
    const app=document.getElementById('app');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const stageNames={el:'小学校',j:'中学校',h:'高校',u:'大学'};
    const schoolChoices={el:[['public','公立'],['private','私立']],j:[['public','公立'],['private','私立']],h:[['public','公立'],['private','私立']],u:[['national','国立'],['public','公立'],['privateHuman','私立・文系'],['privateScience','私立・理系']]};
    const tuition={el:{public:100000,private:1200000},j:{public:150000,private:900000},h:{public:118800,private:457200},u:{national:535800,public:536000,privateHuman:827000,privateScience:1130000}};
    const entry={el:{public:30000,private:200000},j:{public:0,private:180000},h:{public:0,private:200000},u:{national:282000,public:390000,privateHuman:227000,privateScience:250000}};
    function ym(value){let[a,b]=value.split('-').map(Number);return{y:a,m:b}}function ageAt(c,y){return y-ym(c.birth).y}function futureYear(c){return ym(c.birth).y+state.common.targetAge}
    function getPath(obj,path){return path.split('.').reduce((x,k)=>x?.[k],obj)}function setPath(obj,path,value){let keys=path.split('.'),last=keys.pop(),target=keys.reduce((x,k)=>x[k],obj);target[last]=value}
    function input(label,path,value,type='number',attrs=''){return `<div class="field"><label>${label}</label><input type="${type}" data-bind="${path}" value="${esc(value)}" ${attrs}></div>`}
    function currencyInput(label,path,value,attrs=''){return `<div class="field"><label>${label}</label><div class="input-unit"><input type="text" inputmode="decimal" data-man data-bind="${path}" value="${formattedMan(value)}" ${attrs}><span>万円</span></div></div>`}
    function childInput(index,label,path,value,type='number',attrs=''){return `<div class="field"><label>${label}</label><input type="${type}" data-child-bind="${index}.${path}" value="${esc(value)}" ${attrs}></div>`}
    function childCurrency(index,label,path,value,attrs=''){return `<div class="field"><label>${label}</label><div class="input-unit"><input type="text" inputmode="decimal" data-man data-child-bind="${index}.${path}" value="${formattedMan(value)}" ${attrs}><span>万円</span></div></div>`}
    function select(label,path,value,choices){return `<div class="field"><label>${label}</label><select data-bind="${path}">${choices.map(([v,t])=>`<option value="${v}" ${v==value?'selected':''}>${t}</option>`).join('')}</select></div>`}
    function schoolRecords(c){let birth=ym(c.birth).y, start=birth+6, stages=[['el',6],['j',3],['h',3],['u',+c.paths.years]],out=[];let cursor=start;for(const[stage,count]of stages){for(let i=0;i<count;i++){let key=`${stage}${i}`,override=c.overrides[key]||{},factor=Math.pow(1+(+state.common.inflation||0)/100,Math.max(0,cursor-CURRENT_YEAR));let base={year:cursor,stage,key,age:cursor-birth,tuition:tuition[stage][c.paths[stage]]||0,entry:i===0?(entry[stage][c.paths[stage]]||0):0,cram:c.extras[stage].cram,lesson:c.extras[stage].lesson,other:c.extras[stage].other+(stage==='u'&&c.paths.home==='away'?1200000:0)};for(const k of ['tuition','entry','cram','lesson','other'])base[k]=override[k]!==undefined?+override[k]:Math.round(base[k]*factor);out.push(base);cursor++}}return out}
    function periods(plan){return plan.periods.map(p=>({start:String(p.start??'').trim(),end:String(p.end??'').trim(),monthly:String(p.monthly??'').trim()})).filter(p=>p.start!==''&&p.end!==''&&p.monthly!==''&&+p.end>=+p.start).map(p=>({start:+p.start,end:+p.end,monthly:+p.monthly}))}
    function monthlyContribution(plan,monthIndex){let planYear=Math.floor(monthIndex/12)+1,period=periods(plan).find(p=>planYear>=p.start&&planYear<=p.end);return period?period.monthly:+plan.base}
    function benefitFor(record,index){let b=state.benefits,direct=0;if(b.highSupport&&record.stage==='h')direct+=Math.min(record.tuition,record.stage==='h'&&state.children[index].paths.h==='public'?+b.highPublic:+b.highPrivate);if(b.universitySupport&&record.stage==='u'&&+b.dependents>=3){let privateU=state.children[index].paths.u.startsWith('private'),cap=privateU?700000:535800,entryCap=privateU?260000:282000;direct+=Math.min(record.tuition,cap)+Math.min(record.entry,entryCap)}return direct}
    function childAllowance(c,index,year){if(!state.benefits.childAllowance)return 0;let age=ageAt(c,year);if(age<0||age>17)return 0;let high=+state.benefits.dependents>=3&&index>=2;return high?360000:(age<3?180000:120000)}
    function benefitsVisible(){let b=state.benefits;return !!(b.childAllowance||b.highSupport||b.universitySupport||+b.manualAnnual)}

    function investment(){let plans=state.children.map(investmentPlan).join('');return pageHead('積立・運用','共通条件と、お子さまごとの月額・期間別の積立額を設定します。')+`<section class="card panel"><div class="section-title first">共通条件</div><div class="form-grid three">${input('積立開始', 'common.start',state.common.start,'month')}${select('大学進学年齢','common.targetAge',state.common.targetAge,[[17,'17歳'],[18,'18歳'],[19,'19歳']])}${input('想定年利（％）','common.rate',state.common.rate,'number','min="0" max="15" step="0.1"')}${input('教育費上昇率（％）','common.inflation',state.common.inflation,'number','min="0" max="10" step="0.1"')}${currencyInput('NISA投資上限（1人）','common.nisaLimit',state.common.nisaLimit)}${select('積立資産の取り崩し','common.withdraw',state.common.withdraw,[['university','大学から'],['high','高校から'],['all','すべての教育費']])}</div><p class="foot">上限に達したお子さまは、その後の追加投資を止めて計算します。</p></section><div class="grid investment-grid" style="margin-top:18px">${plans}</div><section class="card panel" style="margin-top:18px"><h3>現在の積立見通し</h3><p class="sub">教育費を取り崩した後の年末残高です。金額は万円単位で表示します。</p>${annualChart(compute().annual)}</section>`}
    function benefits(){let b=state.benefits;return pageHead('制度・給付','使う制度を選ぶだけで試算へ反映します。条件や計算方法は「？」から確認できます。')+`<section class="card panel"><div class="section-title first">世帯の前提</div><div class="form-grid three">${input('扶養する子どもの人数','benefits.dependents',b.dependents,'number','min="1" max="10"')}${input('児童手当を教育費に回す割合（％）','benefits.allocation',b.allocation,'number','min="0" max="100"')}${currencyInput('その他の給付（年額）','benefits.manualAnnual',b.manualAnnual)}${input('その他給付の開始年','benefits.manualStart',b.manualStart)}${input('その他給付の終了年','benefits.manualEnd',b.manualEnd)}</div><p class="foot">自治体や勤務先の給付、返済不要の奨学金は「その他の給付」にまとめて入力できます。</p></section><div class="benefit-grid"><section class="card benefit"><div class="benefit-head"><div><h3>児童手当</h3><p class="benefit-summary">教育費に回す分を積立の助けとして反映</p></div><details class="benefit-help"><summary aria-label="児童手当の説明">?</summary><div class="help-panel"><p>お子さまの年齢と登録順から年額を自動計算し、上で設定した割合だけを給付として差し引きます。</p><p><a href="https://www.cfa.go.jp/policies/kokoseido/jidouteate/annai/" target="_blank" rel="noreferrer">制度の詳細を確認</a></p></div></details></div><label class="check"><input type="checkbox" data-bind="benefits.childAllowance" ${b.childAllowance?'checked':''}>試算に含める</label></section><section class="card benefit"><div class="benefit-head"><div><h3>高校授業料支援</h3><p class="benefit-summary">高校の授業料を設定上限まで減額</p></div><details class="benefit-help"><summary aria-label="高校授業料支援の説明">?</summary><div class="help-panel"><p>選択した公立・私立の区分に応じ、授業料から年額上限まで差し引きます。実際の対象条件は世帯や学校により異なります。</p><div class="form-grid">${currencyInput('公立の年額上限','benefits.highPublic',b.highPublic)}${currencyInput('私立の年額上限','benefits.highPrivate',b.highPrivate)}</div><p><a href="https://www.mext.go.jp/a_menu/shotou/mushouka/index.htm" target="_blank" rel="noreferrer">制度の詳細を確認</a></p></div></details></div><label class="check"><input type="checkbox" data-bind="benefits.highSupport" ${b.highSupport?'checked':''}>試算に含める</label></section><section class="card benefit"><div class="benefit-head"><div><h3>大学の授業料等減免</h3><p class="benefit-summary">扶養する子が3人以上の場合に反映</p></div><details class="benefit-help"><summary aria-label="大学の授業料等減免の説明">?</summary><div class="help-panel"><p>扶養する子どもが3人以上の設定時に、大学の授業料と入学金を学校区分ごとの上限まで差し引きます。対象可否は必ず最新条件をご確認ください。</p><p><a href="https://www.mext.go.jp/a_menu/koutou/hutankeigen/index.htm" target="_blank" rel="noreferrer">制度の詳細を確認</a></p></div></details></div><label class="check"><input type="checkbox" data-bind="benefits.universitySupport" ${b.universitySupport?'checked':''}>試算に含める</label></section></div><div class="note" style="margin-top:18px">貸与型奨学金や教育ローンは返済が必要なため、給付としては差し引きません。</div>`}
    function render(){nav();let html=state.page==='dashboard'?dashboard():state.page==='education'?education():state.page==='investment'?investment():benefits();app.innerHTML=html}
    function persistRender(){save();render()}function updateBind(el){let path=el.dataset.bind,value=el.type==='checkbox'?el.checked:(el.dataset.man!==undefined?manValue(el.value):el.value);if(path.startsWith('child.'))setPath(state.children[state.edChild],path.slice(6),value);else setPath(state,path,value)}
    document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;persistRender()}if(b.dataset.action==='child'){state.edChild=+b.dataset.index;persistRender()}if(b.dataset.action==='add-child'){let index=state.children.length;state.children.push(child(new Date().toISOString().slice(0,7),nextChildName()));state.edChild=index;state.benefits.dependents=state.children.length;persistRender()}if(b.dataset.action==='remove-child'&&state.children.length>1){let index=+b.dataset.child,name=state.children[index].name;if(confirm(`${name}の設定を削除しますか？`)){state.children.splice(index,1);if(index<state.edChild)state.edChild--;state.edChild=Math.min(state.edChild,state.children.length-1);state.benefits.dependents=state.children.length;persistRender()}}if(b.dataset.action==='add-period'){state.children[+b.dataset.child].investment.periods.push({start:'',end:'',monthly:''});persistRender()}if(b.dataset.action==='remove-period'){state.children[+b.dataset.child].investment.periods.splice(+b.dataset.period,1);persistRender()}if(b.dataset.action==='reset'){if(confirm('入力した設定を初期値に戻しますか？')){state=defaults();persistRender()}}if(b.dataset.action==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='こども教育資金シミュレーション設定.json';a.click();URL.revokeObjectURL(url)}})
    document.addEventListener('change',e=>{let el=e.target;if(el.dataset.bind){updateBind(el);persistRender()}if(el.dataset.childBind){let [index,...path]=el.dataset.childBind.split('.');setPath(state.children[+index],path.join('.'),el.dataset.man!==undefined?manValue(el.value):el.value);persistRender()}if(el.dataset.row){let c=state.children[state.edChild],key=el.dataset.row;c.overrides[key]??={};c.overrides[key][el.dataset.cost]=el.dataset.man!==undefined?manValue(el.value):numberValue(el.value);persistRender()}})
    function positionChartTip(item,x,y){let tip=item.closest('.chart-wrap')?.querySelector('.chart-tooltip');if(!tip)return;let text=item.dataset.chartTip.replace('｜年齢','\n年齢').replace('｜教育費','\n教育費合計').replace('（','\n・').replace(/・(?=入学金|塾|習い事|その他)/g,'\n・').replace('）','').replace('｜給付・減免','\n給付・減免').replace('｜年末資産','\n年末資産');tip.textContent=text;tip.classList.add('show');let left=Math.min(x+14,window.innerWidth-tip.offsetWidth-12),top=Math.max(12,y-tip.offsetHeight-14);tip.style.left=`${Math.max(12,left)}px`;tip.style.top=`${top}px`}
    function hideChartTip(item){item.closest('.chart-wrap')?.querySelector('.chart-tooltip')?.classList.remove('show')}
    document.addEventListener('pointermove',e=>{let item=e.target.closest?.('[data-chart-tip]');if(item)positionChartTip(item,e.clientX,e.clientY)})
    document.addEventListener('pointerout',e=>{let item=e.target.closest?.('[data-chart-tip]');if(item&&!item.contains(e.relatedTarget))hideChartTip(item)})
    document.addEventListener('focusin',e=>{let item=e.target.closest?.('[data-chart-tip]');if(item){let r=e.target.getBoundingClientRect();positionChartTip(item,r.left+r.width/2,r.top)}})
    document.addEventListener('focusout',e=>{let item=e.target.closest?.('[data-chart-tip]');if(item)hideChartTip(item)})
    function positionAnnualTip(item,x,y){let tip=item.closest('.table-wrap')?.querySelector('.annual-tooltip');if(!tip)return;tip.textContent=item.dataset.annualTip;tip.classList.add('show');let left=Math.min(x+14,window.innerWidth-tip.offsetWidth-12),top=Math.max(12,y-tip.offsetHeight-14);tip.style.left=`${Math.max(12,left)}px`;tip.style.top=`${top}px`}
    function hideAnnualTip(item){item.closest('.table-wrap')?.querySelector('.annual-tooltip')?.classList.remove('show')}
    document.addEventListener('pointermove',e=>{let item=e.target.closest?.('[data-annual-tip]');if(item)positionAnnualTip(item,e.clientX,e.clientY)})
    document.addEventListener('pointerout',e=>{let item=e.target.closest?.('[data-annual-tip]');if(item&&!item.contains(e.relatedTarget))hideAnnualTip(item)})
    document.addEventListener('focusin',e=>{let item=e.target.closest?.('[data-annual-tip]');if(item){let r=item.getBoundingClientRect();positionAnnualTip(item,r.left+r.width/2,r.top)}})
    document.addEventListener('focusout',e=>{let item=e.target.closest?.('[data-annual-tip]');if(item)hideAnnualTip(item)})
    render();
  </script>
</body>
